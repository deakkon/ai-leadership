[project]
name = "sales-engine"
version = "0.1.0"
description = "Local-first AI sales operating system for a fractional AI leadership consulting practice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sales_engine", "sales_engine.agents"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sales-engine = "sales_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
